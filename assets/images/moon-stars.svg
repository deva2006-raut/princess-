<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff8db"/>
      <stop offset="80%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura of Moon -->
  <circle cx="150" cy="150" r="140" fill="url(#auraGlow)"/>

  <!-- Crescent Moon with Smooth Curves -->
  <path d="M 170 40 
           C 240 60 270 145 225 215 
           C 185 275 100 275 55 235 
           C 135 255 210 185 190 105 
           C 182 75 160 55 170 40 Z" 
        fill="url(#moonGlow)" filter="url(#bloom)"/>

  <!-- Soft Moon Surface Craters -->
  <ellipse cx="185" cy="120" rx="9" ry="6" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="195" cy="160" rx="14" ry="10" fill="#fef08a" opacity="0.5"/>
  <ellipse cx="160" cy="205" rx="11" ry="8" fill="#fef08a" opacity="0.6"/>

  <!-- Golden Twinkling Constellation Stars -->
  <g fill="#ffffff">
    <!-- Star 1 -->
    <path d="M 65 75 Q 70 85 80 85 Q 70 85 65 95 Q 60 85 50 85 Q 60 85 65 75 Z"/>
    <circle cx="65" cy="85" r="2.5" fill="#fef08a"/>

    <!-- Star 2 -->
    <path d="M 115 130 Q 118 138 126 138 Q 118 138 115 146 Q 112 138 104 138 Q 112 138 115 130 Z"/>

    <!-- Star 3 -->
    <path d="M 85 195 Q 88 202 95 202 Q 88 202 85 209 Q 82 202 75 202 Q 82 202 85 195 Z"/>

    <!-- Star 4 -->
    <path d="M 245 80 Q 248 86 254 86 Q 248 86 245 92 Q 242 86 236 86 Q 242 86 245 80 Z"/>

    <!-- Micro Stars & Stardust -->
    <circle cx="95" cy="60" r="2" fill="#fff"/>
    <circle cx="135" cy="90" r="1.5" fill="#fde047"/>
    <circle cx="45" cy="140" r="2" fill="#fff"/>
    <circle cx="70" cy="240" r="2" fill="#fde047"/>
    <circle cx="260" cy="140" r="2" fill="#fff"/>
  </g>
</svg>
