<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <radialGradient id="roseGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="catBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#ff80b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f5"/>
    </linearGradient>
    <linearGradient id="stemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="catShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#701a75" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Floating Hearts around Kitten -->
  <g fill="#ec4899" opacity="0.75">
    <path d="M 70 80 C 65 72 50 75 50 87 C 50 100 70 112 70 112 C 70 112 90 100 90 87 C 90 75 75 72 70 80 Z" transform="scale(0.8) translate(20, 20)"/>
    <path d="M 330 110 C 326 103 313 105 313 115 C 313 125 330 135 330 135 C 330 135 347 125 347 115 C 347 105 334 103 330 110 Z" transform="scale(0.7) translate(140, 40)"/>
    <path d="M 280 40 C 276 34 265 36 265 44 C 265 53 280 61 280 61 C 280 61 295 53 295 44 C 295 36 284 34 280 40 Z" transform="scale(0.6) translate(180, 20)"/>
  </g>

  <!-- Kitten Group with Shadow -->
  <g filter="url(#catShadow)">
    
    <!-- Fluffy Kitten Ears -->
    <!-- Left Ear -->
    <path d="M 115 150 L 95 65 C 120 70 145 95 155 120 Z" 
          fill="url(#furGradient)" stroke="#3f1437" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 116 135 L 105 82 C 122 86 138 102 144 118 Z" 
          fill="#ffccd5"/>
    
    <!-- Right Ear -->
    <path d="M 285 150 L 305 65 C 280 70 255 95 245 120 Z" 
          fill="url(#furGradient)" stroke="#3f1437" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 284 135 L 295 82 C 278 86 262 102 256 118 Z" 
          fill="#ffccd5"/>

    <!-- Kitten Body / Plump Chubby Silhouette -->
    <ellipse cx="200" cy="300" rx="95" ry="90" fill="url(#furGradient)" stroke="#3f1437" stroke-width="4.5"/>
    <!-- Soft Belly Patch -->
    <ellipse cx="200" cy="315" rx="65" ry="60" fill="#fff5f8"/>

    <!-- Kitten Head -->
    <path d="M 120 160 
             C 85 180 80 230 115 255 
             C 145 275 255 275 285 255 
             C 320 230 315 180 280 160 
             C 255 140 145 140 120 160 Z" 
          fill="url(#furGradient)" stroke="#3f1437" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Whiskers -->
    <path d="M 90 205 L 45 198 M 85 220 L 40 225" stroke="#3f1437" stroke-width="3" stroke-linecap="round"/>
    <path d="M 310 205 L 355 198 M 315 220 L 360 225" stroke="#3f1437" stroke-width="3" stroke-linecap="round"/>

    <!-- Blushing Rosy Cheeks -->
    <circle cx="125" cy="225" r="18" fill="url(#catBlush)"/>
    <circle cx="275" cy="225" r="18" fill="url(#catBlush)"/>

    <!-- Big Shiny Sparkling Eyes -->
    <!-- Left Eye -->
    <ellipse cx="150" cy="195" rx="14" ry="17" fill="#3f1437"/>
    <circle cx="145" cy="190" r="6" fill="#ffffff"/>
    <circle cx="155" cy="202" r="3" fill="#ffffff"/>
    <!-- Right Eye -->
    <ellipse cx="250" cy="195" rx="14" ry="17" fill="#3f1437"/>
    <circle cx="245" cy="190" r="6" fill="#ffffff"/>
    <circle cx="255" cy="202" r="3" fill="#ffffff"/>

    <!-- Tiny Pink Cute Nose -->
    <path d="M 194 212 L 206 212 L 200 219 Z" fill="#f43f5e" stroke="#3f1437" stroke-width="1.5"/>

    <!-- Sweet Kitty Smile -->
    <path d="M 194 220 C 194 227 186 228 182 225 M 206 220 C 206 227 214 228 218 225" 
          stroke="#3f1437" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Royal Bowtie on Neck -->
    <g transform="translate(200, 268)">
      <path d="M 0 0 L -25 -12 C -30 0 -30 15 -25 22 L 0 5 Z" fill="#ec4899" stroke="#3f1437" stroke-width="3"/>
      <path d="M 0 0 L 25 -12 C 30 0 30 15 25 22 L 0 5 Z" fill="#ec4899" stroke="#3f1437" stroke-width="3"/>
      <circle cx="0" cy="2" r="8" fill="#ffd700" stroke="#3f1437" stroke-width="2.5"/>
    </g>

    <!-- The Romantic Rose Flower Held By Kitten -->
    <g id="flowerGroup">
      <!-- Curved Green Stem -->
      <path d="M 215 360 C 210 320 225 285 240 250" 
            stroke="url(#stemGreen)" stroke-width="6" stroke-linecap="round" fill="none"/>
      
      <!-- Green Leaves -->
      <path d="M 224 315 C 245 310 255 325 245 332 C 235 338 225 328 224 315 Z" 
            fill="#22c55e" stroke="#166534" stroke-width="2"/>
      <path d="M 216 280 C 195 272 188 288 196 295 C 206 300 215 290 216 280 Z" 
            fill="#22c55e" stroke="#166534" stroke-width="2"/>

      <!-- Blooming Red Rose Flower Head -->
      <g transform="translate(245, 235)">
        <!-- Outer petals -->
        <circle cx="0" cy="0" r="28" fill="url(#roseGlow)" stroke="#3f1437" stroke-width="3"/>
        <path d="M -22 -10 C -25 15 5 28 22 15 C 28 -5 10 -25 -5 -25 C -15 -25 -20 -18 -22 -10 Z" 
              fill="#e11d48" stroke="#881337" stroke-width="2"/>
        <!-- Inner petal spirals -->
        <path d="M -12 -5 C -15 10 10 15 12 0 C 15 -10 -5 -15 -12 -5 Z" 
              fill="#be123c"/>
        <path d="M -5 -2 C -5 5 5 5 5 -2 C 5 -8 -5 -8 -5 -2 Z" 
              fill="#fda4af"/>
        <!-- Dew drop sparkle -->
        <circle cx="8" cy="-12" r="3" fill="#ffffff" opacity="0.8"/>
      </g>
    </g>

    <!-- Kitten Paws Clasping the Flower Stem -->
    <!-- Left Paw -->
    <ellipse cx="185" cy="295" rx="16" ry="13" fill="#ffffff" stroke="#3f1437" stroke-width="4"/>
    <path d="M 178 300 L 178 304 M 186 302 L 186 306" stroke="#3f1437" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right Paw -->
    <ellipse cx="225" cy="285" rx="16" ry="13" fill="#ffffff" stroke="#3f1437" stroke-width="4"/>
    <path d="M 220 290 L 220 294 M 228 291 L 228 295" stroke="#3f1437" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Little Paws -->
    <ellipse cx="145" cy="380" rx="20" ry="14" fill="#ffffff" stroke="#3f1437" stroke-width="4"/>
    <ellipse cx="255" cy="380" rx="20" ry="14" fill="#ffffff" stroke="#3f1437" stroke-width="4"/>

  </g>
</svg>
