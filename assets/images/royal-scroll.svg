<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <defs>
    <radialGradient id="waxRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="quillGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="scrollShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#451a03" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cute Kitten Head Peeking Behind Scroll -->
  <g transform="translate(180, 75)" filter="url(#scrollShadow)">
    <!-- Ears -->
    <path d="M -45 -10 L -60 -55 C -45 -50 -30 -35 -20 -20 Z" fill="#ffffff" stroke="#3b0764" stroke-width="3"/>
    <path d="M -45 -15 L -54 -45 C -44 -42 -35 -32 -26 -20 Z" fill="#fbcfe8"/>
    <path d="M 45 -10 L 60 -55 C 45 -50 30 -35 20 -20 Z" fill="#ffffff" stroke="#3b0764" stroke-width="3"/>
    <path d="M 45 -15 L 54 -45 C 44 -42 35 -32 26 -20 Z" fill="#fbcfe8"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="55" ry="42" fill="#ffffff" stroke="#3b0764" stroke-width="3.5"/>
    
    <!-- Eyes (Looking Down Affectionately at Letter) -->
    <path d="M -26 -2 Q -18 8 -10 -2" stroke="#3b0764" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 10 -2 Q 18 8 26 -2" stroke="#3b0764" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="-28" cy="10" rx="9" ry="5" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="28" cy="10" rx="9" ry="5" fill="#f472b6" opacity="0.6"/>
    <!-- Nose & Mouth -->
    <path d="M -3 6 L 3 6 L 0 10 Z" fill="#f43f5e"/>
    <path d="M -3 11 Q 0 14 3 11" stroke="#3b0764" stroke-width="2" fill="none"/>

    <!-- Little Paws Clasping Scroll -->
    <ellipse cx="-55" cy="40" rx="14" ry="11" fill="#fff" stroke="#3b0764" stroke-width="3"/>
    <ellipse cx="55" cy="40" rx="14" ry="11" fill="#fff" stroke="#3b0764" stroke-width="3"/>
  </g>

  <!-- Feather Quill Pen -->
  <g transform="translate(265, 80) rotate(35)">
    <!-- Feather vanes -->
    <path d="M 0 0 C 20 -60 5 -110 -20 -140 C -15 -100 -5 -50 0 0 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
    <path d="M 0 0 C -20 -60 -5 -110 20 -140 C 15 -100 5 -50 0 0 Z" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <!-- Shaft -->
    <line x1="0" y1="15" x2="0" y2="-140" stroke="url(#quillGold)" stroke-width="3"/>
    <!-- Nib tip -->
    <polygon points="-2,15 2,15 0,25" fill="#d97706"/>
    <!-- Ink droplet -->
    <circle cx="0" cy="30" r="3" fill="#ec4899"/>
  </g>

  <!-- Official Royal Wax Seal Stamp -->
  <g transform="translate(180, 185)">
    <!-- Dripping wax outline -->
    <path d="M 0 -35 
             C 15 -36 28 -28 35 -15 
             C 42 0 38 18 30 30 
             C 20 40 5 38 -10 40 
             C -25 42 -38 28 -40 10 
             C -42 -10 -30 -28 -15 -35 Z" 
          fill="url(#waxRed)" stroke="#991b1b" stroke-width="3"/>
    <!-- Embossed Inner Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Crown Monogram in Seal -->
    <path d="M -12 8 L -14 -4 L -7 2 L 0 -12 L 7 2 L 14 -4 L 12 8 Z" fill="#fee2e2"/>
    <circle cx="0" cy="3" r="2" fill="#991b1b"/>
  </g>
</svg>
