<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <linearGradient id="boxPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ecb"/>
      <stop offset="100%" stop-color="#f43f8a"/>
    </linearGradient>
    <linearGradient id="boxPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4c0519" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sparkle stardust -->
  <g fill="#ffd700">
    <path d="M 60 70 Q 64 78 72 78 Q 64 78 60 86 Q 56 78 48 78 Q 56 78 60 70 Z"/>
    <path d="M 330 90 Q 334 97 341 97 Q 334 97 330 104 Q 326 97 319 97 Q 326 97 330 90 Z"/>
    <path d="M 90 280 Q 94 286 100 286 Q 94 286 90 292 Q 86 286 80 286 Q 86 286 90 280 Z"/>
    <path d="M 310 270 Q 314 276 320 276 Q 314 276 310 282 Q 306 276 300 276 Q 306 276 310 270 Z"/>
  </g>

  <g filter="url(#giftShadow)">
    <!-- Main Large Bottom Gift Box (Purple) -->
    <g id="bottomBox" transform="translate(100, 180)">
      <!-- Box base -->
      <rect x="0" y="30" width="200" height="130" rx="12" fill="url(#boxPurple)" stroke="#3b0764" stroke-width="4"/>
      <!-- Vertical ribbon -->
      <rect x="85" y="30" width="30" height="130" fill="url(#ribbonGold)" stroke="#3b0764" stroke-width="3"/>
      <!-- Horizontal ribbon -->
      <rect x="0" y="80" width="200" height="26" fill="url(#ribbonGold)" stroke="#3b0764" stroke-width="3"/>
      <!-- Lid -->
      <rect x="-10" y="10" width="220" height="30" rx="8" fill="#c084fc" stroke="#3b0764" stroke-width="4"/>
      <!-- Lid ribbon -->
      <rect x="85" y="10" width="30" height="30" fill="url(#ribbonGold)" stroke="#3b0764" stroke-width="3"/>
    </g>

    <!-- Top Stacked Gift Box (Pink) -->
    <g id="topBox" transform="translate(130, 70)">
      <!-- Box base -->
      <rect x="0" y="25" width="140" height="95" rx="10" fill="url(#boxPink)" stroke="#831843" stroke-width="4"/>
      <!-- Vertical ribbon -->
      <rect x="58" y="25" width="24" height="95" fill="url(#ribbonGold)" stroke="#831843" stroke-width="3"/>
      <!-- Lid -->
      <rect x="-8" y="10" width="156" height="22" rx="6" fill="#f472b6" stroke="#831843" stroke-width="4"/>
      <!-- Lid ribbon -->
      <rect x="58" y="10" width="24" height="22" fill="url(#ribbonGold)" stroke="#831843" stroke-width="3"/>

      <!-- Gorgeous Satin Ribbon Bow on Top -->
      <g transform="translate(70, 10)">
        <!-- Left bow loop -->
        <path d="M 0 0 C -45 -35 -55 5 -10 2 Z" fill="url(#ribbonGold)" stroke="#831843" stroke-width="3.5"/>
        <path d="M -5 -2 C -30 -22 -35 2 -10 0" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
        <!-- Right bow loop -->
        <path d="M 0 0 C 45 -35 55 5 10 2 Z" fill="url(#ribbonGold)" stroke="#831843" stroke-width="3.5"/>
        <path d="M 5 -2 C 30 -22 35 2 10 0" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
        <!-- Flowing ribbon tails -->
        <path d="M -4 2 Q -30 25 -20 50 Q -15 35 0 10" fill="url(#ribbonGold)" stroke="#831843" stroke-width="2.5"/>
        <path d="M 4 2 Q 30 25 20 50 Q 15 35 0 10" fill="url(#ribbonGold)" stroke="#831843" stroke-width="2.5"/>
        <!-- Center Bow knot with pearl heart -->
        <circle cx="0" cy="2" r="10" fill="url(#ribbonGold)" stroke="#831843" stroke-width="3"/>
        <path d="M 0 -2 C -3 -5 -6 -2 -5 1 C -4 4 0 7 0 7 C 0 7 4 4 5 1 C 6 -2 3 -5 0 -2 Z" fill="#e11d48"/>
      </g>
    </g>

    <!-- Cute Heart Tag hanging from ribbon -->
    <g transform="translate(195, 140) rotate(15)">
      <line x1="0" y1="0" x2="20" y2="35" stroke="#d97706" stroke-width="2"/>
      <path d="M 20 35 C 10 25 -2 38 10 52 C 16 60 20 66 20 66 C 20 66 24 60 30 52 C 42 38 30 25 20 35 Z" 
            fill="#ffffff" stroke="#ec4899" stroke-width="2.5"/>
      <text x="20" y="52" font-family="'Caveat', cursive, sans-serif" font-size="10" font-weight="bold" fill="#db2777" text-anchor="middle">For You</text>
    </g>
  </g>
</svg>
